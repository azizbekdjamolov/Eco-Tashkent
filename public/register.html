<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ro'yxatdan o'tish — Eco Tashkent</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><div id="nav-mount"></div></header>

<section class="section container">
  <div class="form-card">
    <span class="eyebrow">Bizga qo'shiling</span>
    <h2>Yangi hisob yarating</h2>

    <div class="auth-mode-toggle">
      <button type="button" id="mode-google">🔵 Google</button>
      <button type="button" id="mode-telegram">📲 Telegram</button>
      <button type="button" id="mode-email" class="active">✉️ Email</button>
    </div>

    <div class="form-error" id="err"></div>

    <!-- ---- 1) Google: bitta tugma, mavjud Google akkaunt bilan kiradi/yaratadi ---- -->
    <div id="google-block" style="display:none;text-align:center;padding:10px 0;">
      <div id="g_id_button_container" style="display:flex;justify-content:center;"></div>
      <p id="google-unavailable" style="display:none;color:var(--muted);font-size:0.85rem;margin-top:10px;">
        Google bilan kirish hozircha sozlanmagan.
      </p>
    </div>

    <!-- ---- 2) Telegram: telefon -> bot orqali kod -> kodni tasdiqlash ---- -->
    <div id="telegram-block" style="display:none;">
      <form id="tg-form">
        <div class="field">
          <label for="tg-ism">Ismingiz</label>
          <input type="text" id="tg-ism" placeholder="Ism Familiya">
        </div>
        <div class="field">
          <label for="tg-telefon">Telefon raqamingiz</label>
          <input type="text" id="tg-telefon" placeholder="+998901234567">
          <div class="field-hint">
            Avval Telegramda <b>@EcoTashkent_uzBot</b> ga <b>/start</b> bosib,
            shu telefon raqamni yuboring — bot sizni avtomatik ro'yxatdan
            o'tkazadi. Shundan keyin shu yerga qaytib kod so'rang.
          </div>
        </div>
        <button class="btn btn-primary btn-block" type="button" id="tg-send-btn">Kodni Telegramga yuborish</button>

        <div class="field" id="tg-code-field" style="display:none;margin-top:16px;">
          <label for="tg-code">Telegramga kelgan kod</label>
          <input type="text" id="tg-code" inputmode="numeric" maxlength="6" placeholder="000000">
          <button class="btn btn-primary btn-block" type="submit" style="margin-top:10px;">Tasdiqlash va kirish</button>
        </div>
      </form>
    </div>

    <!-- ---- 3) Email/telefon + parol (qo'lda) ---- -->
    <div id="email-block">
      <form id="reg-form">
        <div class="field">
          <label for="ism">Ismingiz</label>
          <input type="text" id="ism" required placeholder="Ism Familiya">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="telefon">Telefon</label>
            <input type="text" id="telefon" placeholder="+998901234567">
          </div>
          <div class="field">
            <label for="email">Email (ixtiyoriy)</label>
            <input type="email" id="email" placeholder="email@mail.com">
          </div>
        </div>
        <div class="field">
          <label for="tuman">Tuman</label>
          <select id="tuman">
            <option value="">Tanlanmagan</option>
          </select>
        </div>
        <div class="field">
          <label for="password">Parol</label>
          <input type="password" id="password" required minlength="6" placeholder="Kamida 6 belgi">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Ro'yxatdan o'tish</button>
      </form>
    </div>

    <p style="margin-top:16px;text-align:center;font-size:0.9rem;">Hisobingiz bormi? <a href="login.html" style="color:var(--brand);font-weight:700;">Kiring</a></p>
  </div>
</section>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
renderNav('');
const err = document.getElementById('err');
function showErr(msg) { err.textContent = msg; err.classList.add('show'); }
function clearErr() { err.classList.remove('show'); }

// ---- Mode toggle (Google / Telegram / Email) — faqat bittasi ko'rinadi ----
const modeGoogle = document.getElementById('mode-google');
const modeTelegram = document.getElementById('mode-telegram');
const modeEmail = document.getElementById('mode-email');
const googleBlock = document.getElementById('google-block');
const telegramBlock = document.getElementById('telegram-block');
const emailBlock = document.getElementById('email-block');

function setMode(mode) {
  [modeGoogle, modeTelegram, modeEmail].forEach(b => b.classList.remove('active'));
  googleBlock.style.display = 'none';
  telegramBlock.style.display = 'none';
  emailBlock.style.display = 'none';
  clearErr();
  if (mode === 'google') { modeGoogle.classList.add('active'); googleBlock.style.display = ''; }
  if (mode === 'telegram') { modeTelegram.classList.add('active'); telegramBlock.style.display = ''; }
  if (mode === 'email') { modeEmail.classList.add('active'); emailBlock.style.display = ''; }
}
modeGoogle.addEventListener('click', () => setMode('google'));
modeTelegram.addEventListener('click', () => setMode('telegram'));
modeEmail.addEventListener('click', () => setMode('email'));
setMode('email');

// ---- 1) Google ----
async function handleGoogleCredential(response) {
  clearErr();
  try {
    const data = await api('/auth/google', { method: 'POST', body: { credential: response.credential } });
    setSession(data.token, data.user);
    window.location.href = 'index.html';
  } catch (e2) {
    showErr(e2.message);
  }
}
(async function initGoogle() {
  try {
    const cfg = await api('/auth/config');
    if (!cfg.googleClientId) {
      document.getElementById('google-unavailable').style.display = '';
      return;
    }
    google.accounts.id.initialize({ client_id: cfg.googleClientId, callback: handleGoogleCredential });
    google.accounts.id.renderButton(document.getElementById('g_id_button_container'), {
      theme: 'outline', size: 'large', shape: 'pill', width: 280
    });
  } catch (e) {
    document.getElementById('google-unavailable').style.display = '';
  }
})();

// ---- 2) Telegram: kod so'rash / tasdiqlash ----
const tgSendBtn = document.getElementById('tg-send-btn');
const tgCodeField = document.getElementById('tg-code-field');
tgSendBtn.addEventListener('click', async () => {
  clearErr();
  const telefon = document.getElementById('tg-telefon').value.trim();
  if (!telefon) { showErr('Telefon raqamini kiriting'); return; }
  tgSendBtn.disabled = true; tgSendBtn.textContent = 'Yuborilmoqda...';
  try {
    await api('/auth/request-code', { method: 'POST', body: { telefon } });
    tgCodeField.style.display = '';
    tgSendBtn.textContent = 'Kod qayta yuborish';
  } catch (e2) {
    showErr(e2.message);
    tgSendBtn.textContent = 'Kodni Telegramga yuborish';
  }
  tgSendBtn.disabled = false;
});

document.getElementById('tg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearErr();
  const telefon = document.getElementById('tg-telefon').value.trim();
  const code = document.getElementById('tg-code').value.trim();
  if (!code) { showErr('Kodni kiriting'); return; }
  try {
    const data = await api('/auth/verify-code', { method: 'POST', body: { telefon, code } });
    setSession(data.token, data.user);
    window.location.href = 'index.html';
  } catch (e2) {
    showErr(e2.message);
  }
});

// ---- 3) Email/telefon + parol ----
const tumanSel = document.getElementById('tuman');
TUMANLAR.forEach(t => {
  const o = document.createElement('option'); o.value = t; o.textContent = t; tumanSel.appendChild(o);
});
