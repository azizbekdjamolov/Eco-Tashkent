<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ro'yxatdan o'tish — Eco Tashkent</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><div id="nav-mount"></div></header>

<section class="section container">
  <div class="form-card">
    <span class="eyebrow">Bizga qo'shiling</span>
    <h2>Yangi hisob yarating</h2>

    <div style="text-align:center;padding:6px 0 16px;">
      <div id="g_id_button_container" style="display:flex;justify-content:center;"></div>
    </div>
    <div class="divider" style="text-align:center;color:var(--muted);font-size:0.85rem;margin-bottom:16px;">— yoki email/telefon bilan —</div>

    <div class="form-error" id="err"></div>
    <form id="reg-form">
      <div class="field">
        <label for="ism">Ismingiz</label>
        <input type="text" id="ism" required placeholder="Ism Familiya">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="telefon">Telefon</label>
          <input type="text" id="telefon" placeholder="+998901234567">
        </div>
        <div class="field">
          <label for="email">Email (ixtiyoriy)</label>
          <input type="email" id="email" placeholder="email@mail.com">
        </div>
      </div>
      <div class="field">
        <label for="tuman">Tuman</label>
        <select id="tuman">
          <option value="">Tanlanmagan</option>
        </select>
      </div>
      <div class="field">
        <label for="password">Parol</label>
        <input type="password" id="password" required minlength="6" placeholder="Kamida 6 belgi">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Ro'yxatdan o'tish</button>
    </form>
    <p style="margin-top:16px;text-align:center;font-size:0.9rem;">Hisobingiz bormi? <a href="login.html" style="color:var(--brand);font-weight:700;">Kiring</a></p>
  </div>
</section>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
renderNav('');

async function handleGoogleCredential(response) {
  const err = document.getElementById('err');
  try {
    const data = await api('/auth/google', { method: 'POST', body: { credential: response.credential } });
    setSession(data.token, data.user);
    window.location.href = 'index.html';
  } catch (e2) {
    err.textContent = e2.message; err.classList.add('show');
  }
}
(async function initGoogle() {
  try {
    const cfg = await api('/auth/config');
    if (!cfg.googleClientId) return;
    google.accounts.id.initialize({ client_id: cfg.googleClientId, callback: handleGoogleCredential });
    google.accounts.id.renderButton(document.getElementById('g_id_button_container'), {
      theme: 'outline', size: 'large', shape: 'pill', width: 280
    });
  } catch (e) { /* Google sozlanmagan bo'lsa jim o'tkazamiz */ }
})();

const tumanSel = document.getElementById('tuman');
TUMANLAR.forEach(t => {
  const o = document.createElement('option'); o.value = t; o.textContent = t; tumanSel.appendChild(o);
});

const form = document.getElementById('reg-form');
const err = document.getElementById('err');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.remove('show');
  const body = {
    ism: document.getElementById('ism').value.trim(),
    telefon: document.getElementById('telefon').value.trim() || null,
    email: document.getElementById('email').value.trim() || null,
    tuman: tumanSel.value || null,
    password: document.getElementById('password').value
  };
  if (!body.telefon && !body.email) {
    err.textContent = 'Telefon yoki email kiritish shart';
    err.classList.add('show');
    return;
  }
  try {
    const data = await api('/auth/register', { method: 'POST', body });
    setSession(data.token, data.user);
    window.location.href = 'index.html';
  } catch (e2) {
    err.textContent = e2.message;
    err.classList.add('show');
  }
});
</script>
</body>
</html>
