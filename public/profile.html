<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — Eco Tashkent</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><div id="nav-mount"></div></header>

<section class="section container">
  <div class="profile-header">
    <div class="profile-avatar" id="avatar">?</div>
    <div>
      <h2 id="p-ism" style="margin-bottom:2px;">—</h2>
      <div style="color:var(--muted);font-size:0.9rem;" id="p-meta">—</div>
    </div>
  </div>

  <div class="tg-card" id="tg-connect-card" style="margin-bottom:26px;">
    <div class="tg-card-head">
      <span class="eyebrow">Telegram Ekotizim</span>
      <span class="tg-sync-pill" id="tg-status-pill">Tekshirilmoqda...</span>
    </div>
    <p id="tg-connect-text">Hisobingizni @EcoTashkent_uzBot bilan bog'lang — e'lonlar, xabarlar va kirish kodlari Telegram orqali keladi.</p>
    <a href="https://t.me/EcoTashkent_uzBot" target="_blank" rel="noopener" class="btn btn-primary" id="tg-connect-btn">📲 Botga o'tish va /start bosish</a>
    <button type="button" class="btn btn-outline" id="tg-refresh-btn">Holatni yangilash</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="items">Mening e'lonlarim</button>
    <button class="tab-btn" data-tab="sent">Yuborgan so'rovlarim</button>
    <button class="tab-btn" data-tab="received">Kelgan so'rovlar</button>
    <button class="tab-btn" data-tab="notif">Bildirishnomalar</button>
  </div>

  <div id="tab-content"><p style="color:#8a9a8c;">Yuklanmoqda...</p></div>
</section>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
