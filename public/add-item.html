<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E'lon joylashtirish — Eco Tashkent</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><div id="nav-mount"></div></header>

<section class="section container">
  <div class="form-card" style="max-width:640px;">
    <span class="eyebrow">Yangi e'lon</span>
    <h2>Buyumingizga ikkinchi hayot bering</h2>
    <div class="form-error" id="err"></div>
    <form id="item-form">
      <div class="field">
        <label for="nomi">Buyum nomi</label>
        <input type="text" id="nomi" required placeholder="Masalan: Ishlaydigan muzlatgich Samsung">
      </div>
      <div class="field">
        <label for="tavsif">Tavsif</label>
        <textarea id="tavsif" placeholder="Buyum haqida qisqacha ma'lumot: holati, o'lchami, olib ketish shartlari..."></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="brend">Brend / model <span class="field-optional">(ixtiyoriy)</span></label>
          <input type="text" id="brend" placeholder="Masalan: Samsung RT38">
        </div>
        <div class="field">
          <label for="olcham">O'lcham / hajm <span class="field-optional">(ixtiyoriy)</span></label>
          <input type="text" id="olcham" placeholder="Masalan: 60x40x180 sm">
        </div>
      </div>
      <div class="field">
        <label for="jihatlar">Qo'shimcha ma'lumot <span class="field-optional">(ixtiyoriy)</span></label>
        <textarea id="jihatlar" placeholder="Nosozliklari, komplektatsiyasi, ishlatilgan muddati va h.k."></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="kategoriya">Kategoriya</label>
          <select id="kategoriya" required></select>
        </div>
        <div class="field">
          <label for="holat">Holati</label>
          <select id="holat">
            <option value="yangi">Yangi</option>
            <option value="yaxshi" selected>Yaxshi</option>
            <option value="ortacha">O'rtacha</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Turi</label>
        <div class="type-toggle" id="tur-toggle">
          <button type="button" data-val="bepul" class="active">Bepul berish</button>
          <button type="button" data-val="almashish">Almashish</button>
          <button type="button" data-val="xayriya">Xayriya</button>
        </div>
      </div>
      <div class="field">
        <label for="tuman">Tuman</label>
        <select id="tuman" required></select>
      </div>
      <div class="field">
        <label>Rasmlar (ixtiyoriy, 4 tagacha)</label>
        <div class="photo-actions">
          <button type="button" class="btn btn-outline btn-sm" id="btn-camera">📷 Kamera bilan olish</button>
          <button type="button" class="btn btn-outline btn-sm" id="btn-gallery">🖼️ Galereyadan tanlash</button>
        </div>
        <input type="file" id="gallery-input" accept="image/*" multiple hidden>
        <div class="photo-preview-grid" id="photo-grid"></div>
        <div class="field-hint">Rasm qo'shsangiz e'loningiz ko'proq e'tibor tortadi.</div>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="submit-btn">E'lonni joylashtirish</button>
    </form>
  </div>
</section>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
renderNav('');
if (!isLoggedIn()) window.location.href = 'login.html';

const katSel = document.getElementById('kategoriya');
KATEGORIYALAR.forEach(k => {
  const o = document.createElement('option'); o.value = k.id; o.textContent = `${k.icon} ${k.label}`; katSel.appendChild(o);
});
const tumanSel = document.getElementById('tuman');
TUMANLAR.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; tumanSel.appendChild(o); });

let turVal = 'bepul';
const turToggle = document.getElementById('tur-toggle');
turToggle.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  turVal = btn.dataset.val;
  [...turToggle.children].forEach(b => b.classList.toggle('active', b === btn));
});

const form = document.getElementById('item-form');
const err = document.getElementById('err');
const submitBtn = document.getElementById('submit-btn');

// ---- Photo picker: camera + gallery, merged into one list (max 4) ----
const MAX_PHOTOS = 4;
let selectedPhotos = []; // File objects
const galleryInput = document.getElementById('gallery-input');
const photoGrid = document.getElementById('photo-grid');

// Some mobile browsers ignore capture="environment" on a re-used <input>
// (especially after it has fired once) and silently fall back to the
// gallery picker. Building a brand-new input each time forces the browser
// to re-evaluate the capture attribute and open the camera app directly.
function openCameraInput() {
  const fresh = document.createElement('input');
  fresh.type = 'file';
  fresh.accept = 'image/*';
  fresh.setAttribute('capture', 'environment');
  fresh.hidden = true;
  fresh.addEventListener('change', () => { addPhotos(fresh.files); fresh.remove(); });
  document.body.appendChild(fresh);
  fresh.click();
}

document.getElementById('btn-camera').addEventListener('click', () => {
  if (selectedPhotos.length >= MAX_PHOTOS) { err.textContent = `Ko'pi bilan ${MAX_PHOTOS} ta rasm qo'shish mumkin`; err.classList.add('show'); return; }
  openCameraInput();
});
document.getElementById('btn-gallery').addEventListener('click', () => {
  if (selectedPhotos.length >= MAX_PHOTOS) { err.textContent = `Ko'pi bilan ${MAX_PHOTOS} ta rasm qo'shish mumkin`; err.classList.add('show'); return; }
  galleryInput.click();
});

function addPhotos(fileList) {
  err.classList.remove('show');
  for (const f of fileList) {
    if (selectedPhotos.length >= MAX_PHOTOS) break;
    if (!/^image\//.test(f.type)) continue;
    selectedPhotos.push(f);
  }
  renderPhotoGrid();
}
galleryInput.addEventListener('change', () => { addPhotos(galleryInput.files); galleryInput.value = ''; });

function renderPhotoGrid() {
  photoGrid.innerHTML = '';
  selectedPhotos.forEach((file, idx) => {
    const cell = document.createElement('div');
    cell.className = 'photo-preview';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    const rm = document.createElement('button');
    rm.type = 'button'; rm.className = 'remove'; rm.textContent = '✕';
    rm.addEventListener('click', () => { selectedPhotos.splice(idx, 1); renderPhotoGrid(); });
    cell.appendChild(img); cell.appendChild(rm);
    photoGrid.appendChild(cell);
  });
  if (selectedPhotos.length < MAX_PHOTOS) {
    const addCell = document.createElement('button');
    addCell.type = 'button'; addCell.className = 'photo-add-btn';
    addCell.innerHTML = '<span style="font-size:1.3rem;">+</span><span>Qo\'shish</span>';
    addCell.addEventListener('click', () => galleryInput.click());
    photoGrid.appendChild(addCell);
  }
}
renderPhotoGrid();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.remove('show');
  submitBtn.disabled = true; submitBtn.textContent = 'Joylanmoqda...';
  try {
    // Combine the extra product-info fields into the tavsif text, since
    // they help buyers understand the item better even though there's
    // no separate database column for each of them.
    const asosiyTavsif = document.getElementById('tavsif').value.trim();
    const brend = document.getElementById('brend').value.trim();
    const olcham = document.getElementById('olcham').value.trim();
    const jihatlar = document.getElementById('jihatlar').value.trim();
    const qoshimchaQatorlar = [];
    if (brend) qoshimchaQatorlar.push(`Brend/model: ${brend}`);
    if (olcham) qoshimchaQatorlar.push(`O'lcham/hajm: ${olcham}`);
    if (jihatlar) qoshimchaQatorlar.push(`Qo'shimcha: ${jihatlar}`);
    const tolaTavsif = [asosiyTavsif, ...qoshimchaQatorlar].filter(Boolean).join('\n');

    const fd = new FormData();
    fd.append('nomi', document.getElementById('nomi').value.trim());
    fd.append('tavsif', tolaTavsif);
    fd.append('kategoriya', katSel.value);
    fd.append('holat', document.getElementById('holat').value);
    fd.append('tur', turVal);
    fd.append('tuman', tumanSel.value);
    for (let i = 0; i < selectedPhotos.length && i < MAX_PHOTOS; i++) fd.append('rasmlar', selectedPhotos[i]);

    const item = await api('/items', { method: 'POST', isForm: true, body: fd });
    window.location.href = `item.html?id=${item.id}`;
  } catch (e2) {
    err.textContent = e2.message;
    err.classList.add('show');
    submitBtn.disabled = false; submitBtn.textContent = "E'lonni joylashtirish";
  }
});
</script>
</body>
</html>
