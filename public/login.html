<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirish — Eco Tashkent</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><div id="nav-mount"></div></header>

<section class="section container">
  <div class="form-card">
    <span class="eyebrow">Xush kelibsiz</span>
    <h2>Hisobingizga kiring</h2>
    <div class="form-error" id="err"></div>
    <form id="login-form">
      <div class="field">
        <label for="identifier">Telefon yoki email</label>
        <input type="text" id="identifier" required placeholder="+998901234567 yoki email@mail.com">
      </div>
      <div class="field">
        <label for="password">Parol</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Kirish</button>
    </form>
    <p style="margin-top:16px;text-align:center;font-size:0.9rem;">Hisobingiz yo'qmi? <a href="register.html" style="color:var(--moss);font-weight:700;">Ro'yxatdan o'ting</a></p>
  </div>
</section>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
renderNav('');
const form = document.getElementById('login-form');
const err = document.getElementById('err');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.remove('show');
  const identifier = document.getElementById('identifier').value.trim();
  const password = document.getElementById('password').value;
  try {
    const data = await api('/auth/login', { method: 'POST', body: { identifier, password } });
    setSession(data.token, data.user);
    window.location.href = 'index.html';
  } catch (e2) {
    err.textContent = e2.message;
    err.classList.add('show');
  }
});
</script>
</body>
</html>
