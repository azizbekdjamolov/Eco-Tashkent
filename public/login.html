<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirish — Eco Tashkent</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><div id="nav-mount"></div></header>

<section class="section container">
  <div class="form-card">
    <span class="eyebrow">Xush kelibsiz</span>
    <h2>Hisobingizga kiring</h2>

    <div class="auth-mode-toggle">
      <button type="button" id="mode-password" class="active">Parol bilan</button>
      <button type="button" id="mode-telegram">📲 Telegram kodi bilan</button>
    </div>

    <div class="form-error" id="err"></div>

    <form id="login-form">
      <div class="field">
        <label for="identifier">Telefon yoki email</label>
        <input type="text" id="identifier" required placeholder="+998901234567 yoki email@mail.com">
      </div>
      <div class="field">
        <label for="password">Parol</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Kirish</button>
    </form>

    <form id="tg-login-form" style="display:none;">
      <div class="field">
        <label for="tg-telefon">Telefon raqamingiz</label>
        <input type="text" id="tg-telefon" placeholder="+998901234567">
        <div class="field-hint">Bu raqam Telegram botga (@EcoTashkent_uzBot) oldindan bog'langan bo'lishi kerak.</div>
      </div>
      <button class="btn btn-primary btn-block" type="button" id="send-code-btn">Kodni Telegramga yuborish</button>

      <div class="field" id="code-field" style="display:none;margin-top:16px;">
        <label for="tg-code">Telegramga kelgan kod</label>
        <input type="text" id="tg-code" inputmode="numeric" maxlength="6" placeholder="000000">
        <button class="btn btn-primary btn-block" type="submit" style="margin-top:10px;">Tasdiqlash va kirish</button>
      </div>
    </form>

    <p style="margin-top:16px;text-align:center;font-size:0.9rem;">Hisobingiz yo'qmi? <a href="register.html" style="color:var(--brand);font-weight:700;">Ro'yxatdan o'ting</a></p>
  </div>
</section>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
renderNav('');

const err = document.getElementById('err');
function showErr(msg) { err.textContent = msg; err.classList.add('show'); }
function clearErr() { err.classList.remove('show'); }

// ---- Mode toggle ----
const modePassword = document.getElementById('mode-password');
const modeTelegram = document.getElementById('mode-telegram');
const loginForm = document.getElementById('login-form');
const tgLoginForm = document.getElementById('tg-login-form');
modePassword.addEventListener('click', () => {
  modePassword.classList.add('active'); modeTelegram.classList.remove('active');
  loginForm.style.display = ''; tgLoginForm.style.display = 'none'; clearErr();
});
modeTelegram.addEventListener('click', () => {
  modeTelegram.classList.add('active'); modePassword.classList.remove('active');
  loginForm.style.display = 'none'; tgLoginForm.style.display = ''; clearErr();
});

// ---- Password login ----
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearErr();
  const identifier = document.getElementById('identifier').value.trim();
  const password = document.getElementById('password').value;
  try {
    const data = await api('/auth/login', { method: 'POST', body: { identifier, password } });
    setSession(data.token, data.user);
    window.location.href = 'index.html';
  } catch (e2) {
    showErr(e2.message);
  }
});

// ---- Telegram code login ----
const sendCodeBtn = document.getElementById('send-code-btn');
const codeField = document.getElementById('code-field');
sendCodeBtn.addEventListener('click', async () => {
  clearErr();
  const telefon = document.getElementById('tg-telefon').value.trim();
  if (!telefon) { showErr('Telefon raqamini kiriting'); return; }
  sendCodeBtn.disabled = true; sendCodeBtn.textContent = 'Yuborilmoqda...';
  try {
    await api('/auth/request-code', { method: 'POST', body: { telefon } });
    codeField.style.display = '';
    sendCodeBtn.textContent = 'Kod qayta yuborish';
  } catch (e2) {
    showErr(e2.message);
    sendCodeBtn.textContent = 'Kodni Telegramga yuborish';
  }
  sendCodeBtn.disabled = false;
});

tgLoginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearErr();
  const telefon = document.getElementById('tg-telefon').value.trim();
  const code = document.getElementById('tg-code').value.trim();
  if (!code) { showErr('Kodni kiriting'); return; }
  try {
    const data = await api('/auth/verify-code', { method: 'POST', body: { telefon, code } });
    setSession(data.token, data.user);
    window.location.href = 'index.html';
  } catch (e2) {
    showErr(e2.message);
  }
});
</script>
</body>
</html>
