<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirish — Eco Tashkent</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><div id="nav-mount"></div></header>

<section class="section container">
  <div class="form-card">
    <span class="eyebrow">Xush kelibsiz</span>
    <h2>Hisobingizga kiring</h2>

    <div class="auth-mode-toggle">
      <button type="button" id="mode-google">🔵 Google</button>
      <button type="button" id="mode-telegram">📲 Telegram</button>
      <button type="button" id="mode-password" class="active">✉️ Email</button>
    </div>

    <div class="form-error" id="err"></div>

    <div id="google-login-block" style="display:none;text-align:center;padding:10px 0;">
      <div id="g_id_button_container" style="display:flex;justify-content:center;"></div>
      <p id="google-unavailable" style="display:none;color:var(--muted);font-size:0.85rem;margin-top:10px;">
        Google bilan kirish hozircha sozlanmagan.
      </p>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="identifier">Telefon yoki email</label>
        <input type="text" id="identifier" required placeholder="+998901234567 yoki email@mail.com">
      </div>
      <div class="field">
        <label for="password">Parol</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Kirish</button>
    </form>

    <form id="tg-login-form" style="display:none;">
      <div class="field">
        <label for="tg-telefon">Telefon raqamingiz</label>
        <input type="text" id="tg-telefon" placeholder="+998901234567">
        <div class="field-hint">Bu raqam Telegram botga (@EcoTashkent_uzBot) oldindan bog'langan bo'lishi kerak.</div>
      </div>
      <button class="btn btn-primary btn-block" type="button" id="send-code-btn">Kodni Telegramga yuborish</button>

      <div class="field" id="code-field" style="display:none;margin-top:16px;">
        <label for="tg-code">Telegramga kelgan kod</label>
        <input type="text" id="tg-code" inputmode="numeric" maxlength="6" placeholder="000000">
        <button class="btn btn-primary btn-block" type="submit" style="margin-top:10px;">Tasdiqlash va kirish</button>
      </div>
    </form>

    <p style="margin-top:16px;text-align:center;font-size:0.9rem;">Hisobingiz yo'qmi? <a href="register.html" style="color:var(--brand);font-weight:700;">Ro'yxatdan o'ting</a></p>
  </div>
</section>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
renderNav('');

const err = document.getElementById('err');
function showErr(msg) { err.textContent = msg; err.classList.add('show'); }
function clearErr() { err.classList.remove('show'); }

// ---- Mode toggle (Google / Telegram / Email) ----
const modeGoogle = document.getElementById('mode-google');
const modePassword = document.getElementById('mode-password');
const modeTelegram = document.getElementById('mode-telegram');
const googleBlock = document.getElementById('google-login-block');
const loginForm = document.getElementById('login-form');
const tgLoginForm = document.getElementById('tg-login-form');
