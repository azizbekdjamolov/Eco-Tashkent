databases:
  - name: eco-tashkent-db
    plan: free
    databaseName: eco_tashkent
    user: eco_tashkent

services:
  - type: web
    name: eco-tashkent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eco-tashkent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BOT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: NODE_VERSION
        value: 20.11.0